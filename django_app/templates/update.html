<!DOCTYPE html>
<html>
<head>                                                                                    
  <h1>Form</h1>
</head>
<body>
 <form method="POST">
   {% csrf_token %}
   <label>Name :</label>
   <input type="text" name="name" value="{{student.name}}"><br></br>
   <label>Age :</label>
   <input type="number" name="age" value="{{student.age}}"><br></br>
   <label>Roll_No :</label>
   <input type="number" name="roll_no" value="{{student.roll_no}}"><br></br>
   <label>contact</label>
   <input type="text" name="contact" value="{{student.contact}}"><br></br>
   <label>Telugu Marks :</label>
   <input type="number" name="telugu" value="{{marks.Telugu}}"><br></br>
   <label>Hindi Marks :</label>
   <input type="number" name="hindi" value="{{marks.Hindi}}"><br></br>
   <label>English Marks :</label>
   <input type="number" name="english" value="{{marks.English}}"><br></br>
   <label>Science Marks :</label>
   <input type="number" name="science" value="{{marks.Science}}"><br></br>
   <button type="submit"> Update </button>
 </form><br></br>
 <h2>{{ message }}</h2>
</body>
</html>
