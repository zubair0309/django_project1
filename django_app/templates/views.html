<!DOCTYPE html>
<html>
<head>
  <style>
    table{
        border-collapse : collapse;
       
    }
    th,td {
        border: 1px solid black;
        padding: 8px;
    }
   
  </style>
  
</head>
<body>
    <h1>LIST OF STUDENTS</h1>
  <div class="data">
    <table>
        <tr>
          <th>NAME</th>
          <th>ROLL NO</th>
          <th>AGE</th>
          <th>CONTACT</th>
          <th>ACTION</th>
        </tr>
        {% for s in students %}
         <tr>
          <td>{{s.name}}</td>
          <td>{{s.roll_no}}</td>
          <td>{{s.age}}</td>
          <td>{{s.contact}}</td>
          <td>
            <a href="{% url 'delete_student' s.roll_no %}">DELETE</a>
          </td>
         </tr>
        {% endfor %}
        

    </table>
  </div>
</body>
</html>
